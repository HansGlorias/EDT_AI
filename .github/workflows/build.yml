name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Test manual scenario summary (offline)
        run: python -m unittest discover -s tests/tools -v

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Maven берётся из wrapper (.mvn/wrapper): Tycho 4.0.x не стартует на
      # более новом Maven, который стоит на runner.
      # UI-тесты на Linux идут под xvfb с GTK 3 — ближе всего к Astra Linux.
      # UTF-8 в локали — для кириллических имён каталогов модулей в UI-тестах.
      - name: Build and test (Linux, GTK под xvfb)
        if: runner.os == 'Linux'
        env:
          LANG: C.UTF-8
        run: xvfb-run -a -s "-screen 0 1280x1024x24" ./mvnw -B -ntp verify

      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        run: .\mvnw.cmd -B -ntp verify

      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            tests/*/target/surefire-reports/
            tests/*/target/work/data/.metadata/.log
          if-no-files-found: ignore

      # Снимки вида чата и настроек из UI-тестов — для просмотра при ревью.
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.os }}
          path: tests/*/target/screenshots/
          if-no-files-found: ignore

      # Выгружаем содержимое update-site, а не готовый zip: GitHub сам
      # упакует артефакт в zip, и скачанный файл сразу ставится в EDT.
      - name: Update site
        id: update_site
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: edtai-update-site
          path: releng/io.github.hansglorias.edtai.repository/target/repository/
          if-no-files-found: error

      - name: How to install this build
        if: runner.os == 'Linux'
        env:
          BUILD_REF: ${{ github.ref }}
          BUILD_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.head_ref || github.ref_name }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ARTIFACT_URL: ${{ steps.update_site.outputs.artifact-url }}
        run: |
          {
            printf '### Установка сборки EDT AI\n\n'
            printf 'Исходная ветка: `%s` · SHA: `%s`\n\n' "$SOURCE_REF" "$SOURCE_SHA"
            printf 'Ref запуска: `%s` · собранный SHA: `%s`\n\n' "$BUILD_REF" "$BUILD_SHA"
            printf 'ZIP для установки: [edtai-update-site](%s). Для скачивания войдите в GitHub.\n\n' "$ARTIFACT_URL"
            printf 'Дождитесь зелёных проверок Ubuntu и Windows. В EDT: **Help → Install New Software… → Add… → Archive…** → скачанный zip.\n\n'
            printf 'Pages обновляется только при push в main. Статус skipped у Pages в PR или ручном запуске не означает отсутствия zip.\n\n'
            printf '[Подробная инструкция](%s/%s/blob/%s/docs/install-pr-build.md)\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$SOURCE_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

  # Update site на GitHub Pages: после каждого слияния в main EDT ставит и
  # обновляет плагин по адресу https://hansglorias.github.io/EDT_AI/
  # (Справка → Установить новое ПО → Добавить). Нужен один раз включённый
  # Pages: Settings → Pages → Source: GitHub Actions.
  pages:
    name: update site на GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    # Два слияния подряд не должны деплоить Pages одновременно.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: edtai-update-site
          path: site

      - name: Страница для браузера
        run: |
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="ru"><head><meta charset="utf-8"><title>EDT AI — update site</title></head>
          <body style="font-family: sans-serif; max-width: 40em; margin: 3em auto">
          <h1>EDT AI</h1>
          <p>Это update site плагина для 1C:EDT. В EDT: <b>Справка → Установить новое ПО… → Добавить</b>,
          адрес — эта страница. Обновления: <b>Справка → Проверить наличие обновлений</b>.</p>
          <p>Исходники: <a href="https://github.com/HansGlorias/EDT_AI">github.com/HansGlorias/EDT_AI</a></p>
          </body></html>
          HTML

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
